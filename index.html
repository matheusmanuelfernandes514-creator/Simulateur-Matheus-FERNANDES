</style></head><body>
<header class="top"><div class="w"><div class="ti"><h1>Rachat de prêt immobilier<small>Simulateur d'arbitrage : gain, point mort, alternatives</small></h1><div class="bar"><button data-act="burato">Cas Burato</button><button data-act="nouveau">Nouveau cas</button><button data-act="imp">Importer un PDF</button><button data-act="copyR">Copier le résumé</button><button class="pri" data-act="pdf">Rapport PDF</button><button data-act="theme" aria-label="Changer de thème">◐</button></div></div><nav id="nav"></nav></div></header>
<main><section id="p_dat"></section><section id="p_res"></section><section id="p_sch"></section><section id="p_alt"></section><section id="p_rap"></section><section id="p_ctl"></section></main>

<script>
//ENGINE
const D0={cap:535000,taux:4,duree:300,debut:'2019-10-01',rachat:'2026-12-31',rev:200000,emp:[{n:'M.',q:100,ao:.18,an:.15},{n:'Mme',q:100,ao:.18,an:.12}],baseAO:'init',baseAN:'init',iraOn:true,iraPct:3,iraMois:6,frais:1000,gar:5039,cour:0,aut:0,restit:2945,rq:'fin',fin:true,bar:[[5,10,2],[11,15,2.35],[16,20,2.75],[21,25,3]],dAuto:true,nd:213,tAuto:true,tMan:2.75,arr:false,actu:3,hor:0,nego:{t:3.4,f:500},tol:1,ex:{},ia:{},qs:['','','',''],rep:{dossier:'Rachat de prêt immobilier',clients:'M. et Mme BURATO',cabinet:'',conseiller:'',comm:'',obj:'Conserver la durée restante et baisser la mensualité'}};
const clone=o=>JSON.parse(JSON.stringify(o));
const pm=(P,r,n)=>n<=0?0:r?P*r/(1-Math.pow(1+r,-n)):P/n;
function addM(s,i){const[y,m,d]=s.split('-').map(Number),t=new Date(Date.UTC(y,m-1+i,1)),z=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(d,z));return t}
const ymd=d=>d.toISOString().slice(0,10);
const insF=(S,key,base,P)=>c=>S.emp.reduce((s,e)=>s+e.q/100*e[key]/100*(base=='init'?P:c)/12,0);
function sched(P,t,n,start,ins,rnd){const r=t/1200,R=x=>rnd?Math.round(x*100)/100:x,p=R(pm(P,r,n));let c=P;const rows=[];
for(let i=0;i<n;i++){const it=R(c*r);let m=p,cap=m-it;if(i==n-1&&rnd){cap=c;m=c+it}const a=ins(c);rows.push({i:i+1,d:addM(start,i),crd:c,m,it,cap,a,tot:m+a,end:Math.abs(c-cap)<1e-6?0:c-cap});c-=cap}return rows}
function bareme(S,n){const y=Math.ceil(n/12),b=S.bar.find(x=>y>=x[0]&&y<=x[1]);return b?b[2]:null}
const rateFor=(S,d)=>S.tAuto?bareme(S,d):S.tMan;
function irr(f,up,T,rs,tr){let lo=-.01,hi=.05;for(let i=0;i<70;i++){const r=(lo+hi)/2;let v=up-T-rs*Math.pow(1+r,-tr);f.forEach((x,t)=>v+=x*Math.pow(1+r,-(t+1)));v>0?lo=r:hi=r}return(Math.pow(1+(lo+hi)/2,12)-1)*100}
function scen(S,O,d,rate,o={}){
const ira=o.ira??O.ira,costs=(o.fees??O.fees)+ira,rs=S.rq=='non'?0:(o.rs??S.restit),up=S.fin?0:costs,P=O.CRD+(S.fin?costs:0);
const rows=sched(P,rate,d,O.start,insF(S,'an',S.baseAN,P),S.arr),T=Math.max(d,O.m),a=Math.pow(1+S.actu/100,1/12);
let cO=0,cN=0,npv=-up+(S.rq=='rachat'?rs:0),si=0,sa=0;const g=[-costs+(S.rq=='rachat'?rs:0)];
for(let t=1;t<=T;t++){const ro=t<=O.m?O.oldRows[t-1]:null,rn=t<=d?rows[t-1]:null,po=ro?ro.tot:0,pn=rn?rn.tot:0;cO+=po;cN+=pn;npv+=(po-pn)/Math.pow(a,t);if(rn){si+=rn.it;sa+=rn.a}
g.push(cO+(ro?ro.end:0)-cN-(rn?rn.end:0)-up+(S.rq=='rachat'?rs:0)+(S.rq=='fin'&&t>=d?rs:0))}
if(S.rq=='fin')npv+=rs/Math.pow(a,d);
return{P,d,rate,rows,g,T,costs,up,rs,ira,si,sa,npv,tPM:g.findIndex(x=>x>=0),pmt:rows[0].m,ass:rows[0].a,tot:rows[0].tot,gainM:O.oldRows[0].tot-rows[0].tot,gainT:g[T],cost:cN+up-rs,teg:irr(rows.map(r=>r.tot),up,O.CRD,rs,S.rq=='rachat'?0:d)}}
const num=x=>parseFloat(x)||0;
function norm(R){const S=clone(R);['cap','taux','duree','rev','iraPct','iraMois','frais','gar','cour','aut','restit','nd','tMan','actu','hor'].forEach(k=>S[k]=num(R[k]));S.emp.forEach(e=>['q','ao','an'].forEach(k=>e[k]=num(e[k])));S.bar=S.bar.filter(b=>b.every(x=>x!=='')).map(b=>b.map(num));S.nego={t:num(R.nego.t),f:num(R.nego.f)};return S}
function calc(R){const S=norm(R),I=m=>({err:m,info:1});
if(!(S.cap>0&&S.duree>=1&&R.taux!==''&&R.debut&&R.rachat))return I('Renseignez le prêt actuel (capital, taux, durée, dates) et l\'offre de rachat dans l\'onglet Données, ou importez un PDF.');
const old=sched(S.cap,S.taux,S.duree,S.debut,insF(S,'ao',S.baseAO,S.cap),S.arr),rd=new Date(S.rachat+'T00:00:00Z'),k=old.filter(r=>r.d<=rd).length,m=S.duree-k;
if(m<1)return{err:'Le prêt actuel est déjà soldé à la date de rachat.'};
if(!S.emp.length)return{err:'Ajoutez au moins un emprunteur.'};
const CRD=k?old[k-1].end:S.cap,ira=S.iraOn?Math.min(S.iraPct/100*CRD,S.iraMois/12*S.taux/100*CRD):0,oldRows=old.slice(k);
const O={S,old,k,m,CRD,ira,oldRows,fees:S.frais+S.gar+S.cour+S.aut,start:ymd(addM(S.debut,k))};
O.cO=oldRows.reduce((s,r)=>s+r.tot,0);O.oI=oldRows.reduce((s,r)=>s+r.it,0);O.oA=oldRows.reduce((s,r)=>s+r.a,0);
if(!S.dAuto&&!(S.nd>=1))return I('Saisissez la durée du nouveau prêt.');O.nd=S.dAuto?m:Math.round(S.nd);O.lk=bareme(S,O.nd);O.rate=S.tAuto&&O.lk!=null?O.lk:S.tMan;if(!(O.rate>0))return I('Aucun taux applicable à cette durée : complétez le barème ou saisissez le taux.');
O.base=scen(S,O,O.nd,O.rate);O.teg0=irr(oldRows.map(r=>r.tot),0,CRD,0,0);return O}
function constDur(S,O){for(let d=6;d<=O.m+240;d++){const r=rateFor(S,d);if(r==null)continue;const P=O.CRD+(S.fin?O.fees+O.ira:0);if(pm(P,r/1200,d)+insF(S,'an',S.baseAN,P)(P)<=O.oldRows[0].tot)return d}return null}
//END
const $=s=>document.querySelector(s),fmt=(x,d=2)=>isFinite(x)?x.toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const eur=x=>fmt(x)+' €',e0=x=>fmt(x,0)+' €',pc=x=>fmt(x)+' %',fd=d=>d.toLocaleDateString('fr-FR',{month:'short',year:'numeric',timeZone:'UTC'}),cl=x=>x>0?'ok':x<0?'ko':'';
let S=clone(D0),CUR,V={sch:'new'},C1,C2;
const gv=k=>k.split('.').reduce((a,p)=>a?.[p],S)??'';
const esc=x=>String(x??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const inp=(l,k,t='number',x='',id='')=>`<label>${l}<input ${id?`id="${id}"`:''} data-k="${k}" type="${t}" ${t=='number'?'step="any"':''} ${x} placeholder="${PH[k]||PH[k.replace(/\.\d+\./,'.i.')]||''}" value="${esc(gv(k))}"></label>`;
const chk=(l,k)=>`<label class="ck"><input type="checkbox" data-k="${k}" ${gv(k)?'checked':''}>${l}</label>`;
const sel=(l,k,o)=>`<label>${l}<select data-k="${k}">${o.map(([v,t])=>`<option value="${v}" ${gv(k)==v?'selected':''}>${t}</option>`).join('')}</select></label>`;
const BS=[['init','Capital initial'],['crd','Capital restant dû']];
function form(){$('#p_dat').innerHTML=impCard()+`<div class="g">
<div class="card"><h3>Prêt actuel</h3>${inp('Capital initial (€)','cap')}<div class="r2">${inp('Taux hors assurance (%)','taux')}${inp('Durée (mois)','duree')}</div><div class="r2">${inp('1re échéance','debut','date')}${inp('Date de rachat','rachat','date')}</div>${inp('Revenus annuels du foyer (€)','rev')}</div>
<div class="card"><h3>Emprunteurs et assurances</h3>${S.emp.map((e,i)=>`<div class="r4">${inp('Nom',`emp.${i}.n`,'text')}${inp('Quotité %',`emp.${i}.q`)}${inp('Ass. actuelle %',`emp.${i}.ao`)}${inp('Ass. nouvelle %',`emp.${i}.an`)}<button data-act="delE:${i}" title="Supprimer">✕</button></div>`).join('')}
<button data-act="addE">+ Emprunteur</button><div class="r2" style="margin-top:10px">${sel('Assiette assurance actuelle','baseAO',BS)}${sel('Assiette assurance nouvelle','baseAN',BS)}</div></div>
<div class="card"><h3>Indemnités de remboursement anticipé</h3>${chk('Appliquer les IRA','iraOn')}<div class="r2">${inp('% du CRD','iraPct')}${inp('Plafond (mois d\'intérêts)','iraMois')}</div><p class="note">IRA = min(% × CRD ; mois d'intérêts au taux actuel).</p></div>
<div class="card"><h3>Offre de la nouvelle banque</h3>${chk('Durée = durée restante','dAuto')}${inp('Durée du nouveau prêt (mois)','nd','number',S.dAuto?'disabled':'','nd')}${chk('Taux selon le barème','tAuto')}${inp('Taux nominal (%)','tMan','number','','tx')}
<table><tr><th>De (ans)</th><th>À (ans)</th><th>Taux %</th><th></th></tr>${S.bar.map((b,i)=>`<tr>${[0,1,2].map(j=>`<td><input type="number" step="any" data-k="bar.${i}.${j}" value="${b[j]}"></td>`).join('')}<td><button data-act="delB:${i}">✕</button></td></tr>`).join('')}</table><button data-act="addB" style="margin-top:8px">+ Tranche</button></div>
<div class="card"><h3>Frais du rachat</h3><div class="r2">${inp('Frais de dossier (€)','frais')}${inp('Garantie (€)','gar')}${inp('Courtage (€)','cour')}${inp('Autres frais (€)','aut')}</div>${inp('Restitution de garantie (€)','restit')}${sel('Restitution comptée','rq',[['fin','À l\'échéance du prêt'],['rachat','Au rachat'],['non','Ignorée']])}${chk('Financer les frais et IRA dans le nouveau prêt','fin')}<p class="note">Garantie Crédit Logement : à saisir depuis le simulateur officiel.</p></div>
<div class="card"><h3>Analyse</h3>${chk('Arrondir mensualités et intérêts au centime','arr')}<div class="r2">${inp('Taux d\'actualisation (%)','actu')}${inp('Horizon de détention (ans, 0 = terme)','hor')}</div><h3 style="margin-top:10px">Renégociation avec la banque actuelle</h3><div class="r2">${inp('Taux obtenu (%)','nego.t')}${inp('Frais d\'avenant (€)','nego.f')}</div></div></div>`}
function pmDate(O,t){return t<0?'—':t==0?'dès le rachat':fd(addM(O.start,t-1))}
const kp=(l,v,s,c='')=>`<div class="kp"><small>${l}</small><b class="${c}">${v}</b><small>${s||''}</small></div>`;
function res(O){const b=O.base,S=O.S,h=S.hor>0?S.hor*12:0,pmm=b.tPM,eff=x=>x/(S.rev/12)*100,o0=O.oldRows[0];
let v;if(b.gainT<=0)v=['ko','Rachat non pertinent','Le gain total est nul ou négatif : conservez le prêt actuel ou renégociez.'];
else if(pmm>=0&&(!h||pmm<=h))v=['ok','Rachat pertinent',`Économie nette de ${e0(b.gainT)} ; frais amortis ${pmm?`en ${pmm} mois (${pmDate(O,pmm)})`:'immédiatement'}.`];
else v=['wa','Rachat à nuancer',`Gain de ${e0(b.gainT)} au terme, mais le point mort (${pmm<0?'jamais atteint':pmm+' mois'}) dépasse l'horizon de ${S.hor} ans.`];
O.v=v;const wp=pmm<0?100:pmm/b.T*100;const d=(a,b,c)=>`<tr><td>${a}</td><td>${b.a}</td><td>${b.n}</td><td class="${c===0?'':cl(-b.d)}">${b.d>0?'+':''}${b.t}</td></tr>`;
const row=(l,x,y,f,neutral)=>d(l,{a:f(x),n:f(y),d:y-x,t:f(y-x)},neutral?0:1);
const cmp=[row('Capital / nouveau prêt',O.CRD,b.P,eur,1),row('Durée (mois)',O.m,b.d,x=>fmt(x,0),1),row('Taux nominal',S.taux,b.rate,pc,1),row('Mensualité hors assurance',o0.m,b.pmt,eur),row('Assurance mensuelle',o0.a,b.ass,eur),row('Mensualité totale',o0.tot,b.tot,eur),row('Taux d\'effort',eff(o0.tot),eff(b.tot),pc),row('Intérêts restants',O.oI,b.si,e0),row('Assurance restante',O.oA,b.sa,e0),row('IRA + frais',0,b.costs,e0),row('Restitution de garantie',0,-b.rs,e0),row('Coût total restant',O.cO,b.cost,e0),row('Taux effectif restant (assurance incluse)',O.teg0,b.teg,pc)].join('');
